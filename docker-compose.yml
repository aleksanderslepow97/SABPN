version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${django-insecure-0x3ai&tso4@@j+g-8lgwl^qig7-61gr@q&!)*_fvd2lk(9wf+4}
      - DB_NAME=${'django_project'}
      - DB_USER=${postgres}
      - DB_PASSWORD=${1613}
      - DB_HOST=localhost
      - DB_PORT=5432
    depends_on:
      - db

  db:
    image: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"